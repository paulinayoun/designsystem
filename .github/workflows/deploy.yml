name: 🚀 Deploy to GitHub Pages

# 언제 실행할지 정의
on:
  push:
    branches: [ react-deploy ]  # react-deploy 브랜치에 푸시할 때
  pull_request:
    branches: [ react-deploy ]  # react-deploy 으로 PR 생성할 때 보통은 main 브랜치로 PR을 생성하지만, 예제에서는 react-deploy 사용

# 실행할 작업들
jobs:
  # 첫 번째 작업: 빌드 테스트
  build-test:
    name: 🔍 Build Test
    runs-on: ubuntu-latest  # Ubuntu 환경에서 실행
    
    steps:
    # 1단계: 코드 가져오기
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    # 2단계: Node.js 설치
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'  # npm 캐시 사용으로 속도 향상
    
    # 3단계: 의존성 설치
    - name: ⚡ Install Dependencies
      run: npm ci  # npm install보다 빠르고 안정적
    
    # 4단계: React 앱 빌드
    - name: 🏗️ Build React App
      run: npm run build
    
    # 5단계: Storybook 빌드
    - name: 📚 Build Storybook
      run: npm run build-storybook
    
    # 6단계: 빌드 결과 확인
    - name: ✅ Verify Build
      run: |
        echo "React 앱 빌드 결과:"
        ls -la dist/
        echo "Storybook 빌드 결과:"
        ls -la storybook-static/